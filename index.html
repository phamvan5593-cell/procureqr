<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProcureQR v3.0 - Công Ty TNHH TM-KT Song Hiệp Lợi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 font-bold px-3 py-1.5 rounded-lg text-xl tracking-wider">SHL</div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">ProcureQR <span class="text-xs bg-blue-500 text-white px-2 py-0.5 rounded-full font-normal">v3.0</span></h1>
                    <p class="text-xs text-slate-400">CÔNG TY TNHH TM-KT SONG HIỆP LỢI</p>
                </div>
            </div>
            <div id="syncStatusBadge" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-full flex items-center space-x-2 border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                <span>Lưu trữ Nội bộ</span>
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <nav class="bg-slate-800 text-slate-300 text-sm font-medium border-t border-slate-700">
            <div class="max-w-7xl mx-auto px-4 flex space-x-1 overflow-x-auto">
                <button onclick="switchTab('prTab')" id="btn-prTab" class="tab-btn px-4 py-3 flex items-center space-x-2 border-b-2 border-blue-500 text-white bg-slate-700/50">
                    <i class="fa-solid fa-file-pen text-blue-400"></i><span>Đề Xuất (PR)</span>
                </button>
                <button onclick="switchTab('settingsTab')" id="btn-settingsTab" class="tab-btn px-4 py-3 flex items-center space-x-2 border-b-2 border-transparent hover:text-white">
                    <i class="fa-solid fa-sliders text-slate-400"></i><span>Cấu Hình Sync</span>
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- TAB 1: PHIẾU ĐỀ XUẤT MUA HÀNG (PR) -->
        <div id="prTab" class="tab-content active space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Form Đề Xuất -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center space-x-2">
                        <i class="fa-solid fa-circle-plus text-blue-600"></i>
                        <span>Tạo Phiếu Đề Xuất Mua Hàng</span>
                    </h2>
                    <form id="prForm" onsubmit="handleCreatePR(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Người Đề Xuất *</label>
                            <input type="text" id="prRequester" required placeholder="Ví dụ: Anh Tuấn (Kỹ thuật)" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên Vật Tư / Thiết Bị *</label>
                            <input type="text" id="prItemName" required placeholder="Cảm biến quang Omron, Cầu chì..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mã Part No.</label>
                                <input type="text" id="prPartNo" placeholder="E3F3-R2R2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Số Lượng *</label>
                                <input type="number" id="prQty" required min="1" value="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Lý Do / Mục Đích Sử Dụng</label>
                            <textarea id="prReason" rows="3" placeholder="Thay thế máy sản xuất dòng 2..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>
                        <button type="submit" id="btnSubmitPR" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span>Gửi Phiếu Đề Xuất (PR)</span>
                        </button>
                    </form>
                </div>

                <!-- Danh sách PR -->
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                            <i class="fa-solid fa-list-check text-slate-600"></i>
                            <span>Danh Sách Đề Xuất Đang Chờ Duyệt</span>
                        </h2>
                        <span id="prCount" class="text-xs bg-slate-100 font-semibold text-slate-600 px-2.5 py-1 rounded-full">0 đơn</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="py-3 px-3">Mã PR</th>
                                    <th class="py-3 px-3">Người Tạo</th>
                                    <th class="py-3 px-3">Vật Tư</th>
                                    <th class="py-3 px-3 text-center">SL</th>
                                    <th class="py-3 px-3">Trạng Thái</th>
                                </tr>
                            </thead>
                            <tbody id="prTableBody" class="divide-y divide-slate-100">
                                <!-- Render JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB CẤU HÌNH SYNC -->
        <div id="settingsTab" class="tab-content space-y-6">
            <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-cloud-arrow-up text-blue-600"></i>
                    <span>Kết Nối Google Sheets (Cơ Sở Dữ Liệu Miễn Phí)</span>
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Google Apps Script Web App URL</label>
                        <input type="url" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono">
                    </div>
                    <div class="flex space-x-3">
                        <button onclick="saveSyncConfig()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Lưu Cấu Hình Sync</button>
                        <button onclick="testConnection()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-4 py-2 rounded-lg text-sm transition border border-slate-300">Kiểm Tra Kết Nối</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        let scriptUrl = localStorage.getItem('shl_script_url') || '';

        document.addEventListener('DOMContentLoaded', () => {
            if (scriptUrl) {
                document.getElementById('scriptUrlInput').value = scriptUrl;
                updateSyncBadge(true);
            }
            renderPRTable();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('border-blue-500', 'text-white', 'bg-slate-700/50'));
            document.getElementById(tabId).classList.add('active');
            const btn = document.getElementById('btn-' + tabId);
            if (btn) btn.classList.add('border-blue-500', 'text-white', 'bg-slate-700/50');
        }

        function saveSyncConfig() {
            const url = document.getElementById('scriptUrlInput').value.trim();
            if (!url.startsWith('https://script.google.com/macros/s/') || !url.endsWith('/exec')) {
                alert('❌ Đường link không hợp lệ! Link chuẩn phải bắt đầu bằng https://script.google.com/macros/s/ và kết thúc bằng /exec');
                return;
            }
            localStorage.setItem('shl_script_url', url);
            scriptUrl = url;
            updateSyncBadge(true);
            alert('✅ Đã lưu cấu hình link Google Sheets!');
        }

        function testConnection() {
            const url = document.getElementById('scriptUrlInput').value.trim();
            if (!url.startsWith('https://script.google.com/macros/s/') || !url.endsWith('/exec')) {
                alert('❌ Đường link không đúng định dạng Google Apps Script!');
                updateSyncBadge(false);
                return;
            }

            fetch(url + '?action=getData')
                .then(res => res.json())
                .then(data => {
                    alert('✅ Kết nối Google Sheets thành công! Dữ liệu sẵn sàng.');
                    updateSyncBadge(true);
                })
                .catch(err => {
                    alert('❌ Lỗi kết nối! Kiểm tra lại xem bản Triển khai trong Apps Script đã bật "Bất kỳ ai" (Anyone) chưa.');
                    updateSyncBadge(false);
                });
        }

        function updateSyncBadge(isSynced) {
            const badge = document.getElementById('syncStatusBadge');
            if (isSynced) {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>Đã Kết Nối Sheets</span>`;
            } else {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span><span>Lưu trữ Nội bộ</span>`;
            }
        }

        function handleCreatePR(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitPR');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Đang gửi về Google Sheets...</span>`;

            const prData = {
                id: 'PR-' + Date.now().toString().slice(-6),
                requester: document.getElementById('prRequester').value,
                itemName: document.getElementById('prItemName').value,
                partNo: document.getElementById('prPartNo').value,
                qty: document.getElementById('prQty').value,
                reason: document.getElementById('prReason').value,
                status: 'Chờ Duyệt',
                date: new Date().toLocaleDateString('vi-VN')
            };

            // Lưu Local Storage
            let prList = JSON.parse(localStorage.getItem('shl_pr_list') || '[]');
            prList.unshift(prData);
            localStorage.setItem('shl_pr_list', JSON.stringify(prList));

            // Đẩy thẳng về Google Sheets
            if (scriptUrl) {
                fetch(scriptUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'SAVE_PR', data: prData })
                }).then(() => {
                    alert('🎉 Tạo đơn PR và Đồng bộ lên Google Sheets thành công!');
                    resetFormAndTable();
                }).catch(() => {
                    alert('Tạo đơn PR thành công (Lưu nội bộ)!');
                    resetFormAndTable();
                });
            } else {
                alert('Tạo đơn PR thành công (Lưu nội bộ)!');
                resetFormAndTable();
            }
        }

        function resetFormAndTable() {
            const btn = document.getElementById('btnSubmitPR');
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Gửi Phiếu Đề Xuất (PR)</span>`;
            document.getElementById('prForm').reset();
            renderPRTable();
        }

        function renderPRTable() {
            let prList = JSON.parse(localStorage.getItem('shl_pr_list') || '[]');
            const tbody = document.getElementById('prTableBody');
            document.getElementById('prCount').textContent = prList.length + ' đơn';

            if (prList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">Chưa có đề xuất nào được tạo</td></tr>`;
                return;
            }

            tbody.innerHTML = prList.map(item => `
                <tr class="hover:bg-slate-50">
                    <td class="py-3 px-3 font-semibold text-blue-900">${item.id}</td>
                    <td class="py-3 px-3">${item.requester}</td>
                    <td class="py-3 px-3">
                        <div class="font-medium">${item.itemName}</div>
                        <div class="text-xs text-slate-400">${item.partNo ? 'Part: ' + item.partNo : ''}</div>
                    </td>
                    <td class="py-3 px-3 text-center font-bold">${item.qty}</td>
                    <td class="py-3 px-3"><span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2 py-0.5 rounded-full">${item.status}</span></td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
